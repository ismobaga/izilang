name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        config: [Debug, Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install build dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y build-essential cmake

    - name: Configure project (Unix)
      if: runner.os != 'Windows'
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DIZI_BUILD_TESTS=ON

    - name: Configure project (Windows)
      if: runner.os == 'Windows'
      run: cmake -S . -B build -DIZI_BUILD_TESTS=ON

    - name: Build project (Unix)
      if: runner.os != 'Windows'
      run: cmake --build build --parallel

    - name: Build project (Windows)
      if: runner.os == 'Windows'
      run: cmake --build build --config ${{ matrix.config }} --parallel

    - name: Run tests (Unix)
      if: runner.os != 'Windows'
      run: ctest --test-dir build --output-on-failure

    - name: Run tests (Windows)
      if: runner.os == 'Windows'
      run: ctest --test-dir build --build-config ${{ matrix.config }} --output-on-failure

    - name: Upload artifacts
      if: matrix.config == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: izilang-${{ runner.os }}-${{ matrix.config }}
        path: |
          build/izi*
          build/${{ matrix.config }}/izi*
          build/izilang_tests*
          build/${{ matrix.config }}/izilang_tests*
